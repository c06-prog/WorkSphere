server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/worksphere_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

worksphere:
  jwt:
    secret: ${JWT_SECRET:worksphere-test-secret-key-must-be-at-least-32-characters-long}
    access-token-expiry-seconds: 900