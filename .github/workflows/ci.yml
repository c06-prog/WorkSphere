name: WorkSphere CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Validate Repository & Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Canonical Documentation
        run: |
          echo "Checking canonical documents..."
          test -f docs/01_PROJECT_SCOPE.md
          test -f docs/02_USER_ROLES_AND_WORKFLOWS.md
          test -f docs/03_MOBILE_SCREEN_MAP.md
          test -f docs/04_SYSTEM_ARCHITECTURE.md
          test -f docs/05_DATABASE_DESIGN.md
          test -f docs/06_API_CONTRACT.md
          test -f docs/07_FOUR_COURSE_MATRIX.md
          test -f docs/08_DEVELOPMENT_ROADMAP.md
          test -f docs/09_CODING_STANDARDS.md
          test -f docs/10_AI_AGENT_INSTRUCTIONS.md
          echo "All 10 canonical documents exist."

      - name: Check for Accidentally Committed Secrets
        run: |
          echo "Scanning for forbidden secret files..."
          if find . -name "*.key" -o -name "*.pem" -o -name ".env" | grep -v "^./.env.example"; then
            echo "Error: Detected forbidden key or real .env file committed!"
            exit 1
          fi
          echo "Secret audit passed."

  backend-ci:
    name: Backend Quality (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repository-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Backend Checkstyle Quality Gate
        working-directory: backend
        run: ./mvnw checkstyle:check -Dcheckstyle.config.location=checkstyle.xml -B

      - name: Run Backend Tests (Unit & Testcontainers)
        working-directory: backend
        run: ./mvnw clean test -B

      - name: Package Executable JAR
        working-directory: backend
        run: ./mvnw package -DskipTests -B

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/**
          retention-days: 14

      - name: Upload Backend Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-executable-jar
          path: backend/target/backend-*.jar
          retention-days: 14

  mobile-quality:
    name: Mobile Quality (React Native)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: repository-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Lint mobile code
        working-directory: mobile
        run: npm run lint

      - name: Typecheck mobile code
        working-directory: mobile
        run: npm run typecheck

      - name: Run mobile unit tests
        working-directory: mobile
        run: npm test -- --runInBand

  android-debug-build:
    name: Android Debug Build (React Native)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - repository-validation
      - mobile-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Make Gradle Wrapper Executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Exists
        run: |
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          echo "Verified app-debug.apk successfully generated."

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worksphere-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
  docker-image-build:
    name: Docker Image Build (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - repository-validation
      - backend-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Backend Docker Image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag worksphere-backend:ci \
            --tag worksphere-backend:sha-${{ steps.vars.outputs.short_sha }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            backend

      - name: Inspect Docker Image Metadata
        run: |
          docker image inspect worksphere-backend:ci
          docker history --no-trunc worksphere-backend:ci

      - name: Verify Image Tags and Configuration
        run: |
          CI_ID=$(docker image inspect --format '{{.Id}}' worksphere-backend:ci)
          SHA_ID=$(docker image inspect --format '{{.Id}}' worksphere-backend:sha-${{ steps.vars.outputs.short_sha }})
          if [ "$CI_ID" != "$SHA_ID" ]; then
            echo "Error: Tag worksphere-backend:ci and sha tag have different IDs!"
            exit 1
          fi
          echo "Verified both tags point to image ID: $CI_ID"

          CONFIG_USER=$(docker image inspect --format '{{.Config.User}}' worksphere-backend:ci)
          if [ "$CONFIG_USER" != "worksphere" ] && [ "$CONFIG_USER" != "10001" ]; then
            echo "Error: Image user is '$CONFIG_USER', expected worksphere or 10001!"
            exit 1
          fi
          echo "Verified image user: $CONFIG_USER"

          EXPOSED_PORT=$(docker image inspect --format '{{json .Config.ExposedPorts}}' worksphere-backend:ci)
          echo "Exposed ports: $EXPOSED_PORT"
          echo "$EXPOSED_PORT" | grep '8080/tcp' || (echo 'Port 8080/tcp not exposed!' && exit 1)

          HEALTHCHECK_TEST=$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' worksphere-backend:ci)
          echo "Healthcheck: $HEALTHCHECK_TEST"
          if [ -z "$HEALTHCHECK_TEST" ] || [ "$HEALTHCHECK_TEST" = "null" ]; then
            echo "Error: Healthcheck missing!"
            exit 1
          fi

          ENTRYPOINT=$(docker image inspect --format '{{json .Config.Entrypoint}}' worksphere-backend:ci)
          echo "Entrypoint: $ENTRYPOINT"
          echo "$ENTRYPOINT" | grep 'app.jar' || (echo 'Entrypoint app.jar missing!' && exit 1)

          REVISION_LABEL=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' worksphere-backend:ci)
          echo "Revision label: $REVISION_LABEL"
          if [ "$REVISION_LABEL" != "${{ github.sha }}" ]; then
            echo "Error: Revision label mismatch!"
            exit 1
          fi

      - name: Verify Non-root Runtime UID and GID
        run: |
          RUN_ID=$(docker run --rm --entrypoint id worksphere-backend:ci)
          echo "Runtime user id: $RUN_ID"
          echo "$RUN_ID" | grep 'uid=10001' || (echo 'UID 10001 mismatch!' && exit 1)
          echo "$RUN_ID" | grep 'gid=10001' || (echo 'GID 10001 mismatch!' && exit 1)

      - name: Verify Java 21 Runtime in Image
        run: |
          docker run --rm --entrypoint java worksphere-backend:ci -version

      - name: Audit Layer & Secret Hygiene
        run: |
          echo "Auditing history and env for secret leak patterns..."
          ENV_JSON=$(docker image inspect --format '{{json .Config.Env}}' worksphere-backend:ci)
          echo "$ENV_JSON"
          for PATTERN in 'PASSWORD=' 'SECRET=' 'KEY=' 'TOKEN=' 'PRIVATE KEY'; do
            if echo "$ENV_JSON" | grep -i "$PATTERN"; then
              echo "Error: Sensitive pattern '$PATTERN' detected in environment!"
              exit 1
            fi
          done
          echo "Secret and layer audit passed cleanly."
